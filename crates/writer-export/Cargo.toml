[package]
name = "writer-export"
description = "Markdown, plain-text and DOCX exporters for The Writer."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
writer-core.workspace = true
unicode-segmentation.workspace = true
# General categories (where Markdown emphasis delimiters are valid) and emoji
# properties (how X counts characters).
unicode-properties = "0.1.5"
# Raw DEFLATE for the DOCX (ZIP) container.
miniz_oxide = "0.8"

[dev-dependencies]
# An independent CommonMark parser: the Markdown tests parse the exporter's
# output and compare it with the document.
pulldown-cmark = { version = "0.13", default-features = false }
# An independent ZIP reader and XML parser for the DOCX package tests.
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
