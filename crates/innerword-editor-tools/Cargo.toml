[package]
name = "innerword-editor-tools"
description = "Contextual editor overlays for Inner Word: format menu, insert menu, link popover, font picker, find and replace, the text context menu, the floating format bar, the menu and the description of an image."
version.workspace = true
edition.workspace = true
publish.workspace = true
# tests/main.rs is the one test binary; the other files in tests/ are its modules.
autotests = false

[lib]
# All tests live in tests/main.rs, so the crate links one GPUI test binary.
test = false
doctest = false

[dependencies]
gpui.workspace = true
# localtime_r for "today's date" (already in the lock tree through gpui).
libc = "0.2"
innerword-core.workspace = true
innerword-editor.workspace = true
innerword-ui.workspace = true

[dev-dependencies]
# Headless GPUI tests: #[gpui::test], TestAppContext, VisualTestContext.
gpui = { workspace = true, features = ["test-support"] }

[[test]]
name = "main"
path = "tests/main.rs"
