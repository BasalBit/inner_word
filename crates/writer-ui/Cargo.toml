[package]
name = "writer-ui"
description = "Theme tokens and shared GPUI widgets for The Writer."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
# Headless GPUI tests: #[gpui::test], TestAppContext, VisualTestContext.
gpui = { workspace = true, features = ["test-support"] }
anyhow.workspace = true
# The gallery example captures its own window for visual QA (same approach as
# writer-app's screenshot module): the NSWindow number behind a GPUI window.
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc = "0.2"

[[example]]
name = "gallery"
path = "examples/gallery/main.rs"
