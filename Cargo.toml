[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Internal crates
writer-core = { path = "crates/writer-core" }
writer-store = { path = "crates/writer-store" }
writer-export = { path = "crates/writer-export" }
writer-vim = { path = "crates/writer-vim" }
writer-ui = { path = "crates/writer-ui" }
writer-editor = { path = "crates/writer-editor" }
writer-editor-tools = { path = "crates/writer-editor-tools" }
writer-vim-mode = { path = "crates/writer-vim-mode" }
writer-comments = { path = "crates/writer-comments" }
writer-library = { path = "crates/writer-library" }
writer-spell = { path = "crates/writer-spell" }
# Agents: the command layer, the MCP protocol layer, and what is known about
# the agents on a Mac (none of them depends on GPUI). The command line tool
# `writer` is the binary of crates/writer-cli; it ships inside the app bundle.
writer-agent = { path = "crates/writer-agent" }
writer-mcp = { path = "crates/writer-mcp" }
writer-agent-setup = { path = "crates/writer-agent-setup" }
# The assistant inside the app: the engine behind one interface (Claude Code is
# its first backend; no GPUI), the shared chat components with the side chat
# panel, and the quick chat popover.
writer-assistant = { path = "crates/writer-assistant" }
writer-assistant-ui = { path = "crates/writer-assistant-ui" }
writer-assistant-quick = { path = "crates/writer-assistant-quick" }
writer-keymap = { path = "crates/writer-keymap" }
writer-keymap-ui = { path = "crates/writer-keymap-ui" }
# Printing: what a printed page is as data, the PDF made of it, the macOS print
# operation (no GPUI, and still built in `target/`: see its manifest).
writer-print = { path = "crates/writer-print" }
# Image files: bytes as they come to bytes as the library stores them (no GPUI;
# the app and the command layer for agents make the same thing of the same file).
writer-image = { path = "crates/writer-image" }

# Shared third-party crates. Crate-specific dependencies are declared in the
# crate's own Cargo.toml, not here.
# runtime_shaders: this machine has no offline Metal toolchain (xcrun metal fails with
# "missing Metal Toolchain"), so shaders are compiled at runtime by Metal.framework.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
unicode-segmentation = "1"
# localtime_r (dates in the editor tools, times in the version history).
libc = "0.2"
# The NSWindow behind a GPUI window (window capture for visual QA) and
# Objective-C calls (user name, user defaults, forcing a frame).
raw-window-handle = "0.6"
objc = "0.2"
# CoreFoundation and CoreGraphics (the PDF of a print job, ImageIO for image
# files): the versions gpui locks, so nothing is compiled twice in `target/`.
core-foundation = "0.10"
core-graphics = "0.24"
# Throwaway libraries on disk in tests.
tempfile = "3"

# Disk on the build machine is tight: keep debug info minimal.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "debuginfo"
