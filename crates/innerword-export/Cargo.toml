[package]
name = "innerword-export"
description = "Markdown, plain-text and DOCX exporters and Markdown and plain-text importers for Inner Word."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
innerword-core.workspace = true
unicode-segmentation.workspace = true
# General categories (where Markdown emphasis delimiters are valid) and emoji
# properties (how X counts characters).
unicode-properties = "0.1.5"
# Raw DEFLATE for the DOCX (ZIP) container.
miniz_oxide = "0.8"
# The CommonMark parser behind the Markdown importer. The Markdown tests
# also parse the exporter's output with it and compare it with the document.
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
# An independent ZIP reader and XML parser for the DOCX package tests.
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
# A URL parser as a browser or a Markdown viewer reads a link: where the
# path of a picture file ends and how it is decoded.
url = "2"
