[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.10.1"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/BasalBit/inner_word"
homepage = "https://basalbit.github.io/inner_word/"

[workspace.dependencies]
# Internal crates
innerword-core = { path = "crates/innerword-core" }
innerword-store = { path = "crates/innerword-store" }
innerword-export = { path = "crates/innerword-export" }
innerword-vim = { path = "crates/innerword-vim" }
innerword-ui = { path = "crates/innerword-ui" }
innerword-editor = { path = "crates/innerword-editor" }
innerword-editor-tools = { path = "crates/innerword-editor-tools" }
innerword-vim-mode = { path = "crates/innerword-vim-mode" }
innerword-comments = { path = "crates/innerword-comments" }
innerword-library = { path = "crates/innerword-library" }
innerword-spell = { path = "crates/innerword-spell" }
# Agents: the command layer, the MCP protocol layer, and what is known about
# the agents on a Mac (none of them depends on GPUI). The command line tool
# `innerword` is the binary of crates/innerword-cli; it ships inside the app bundle.
innerword-agent = { path = "crates/innerword-agent" }
innerword-mcp = { path = "crates/innerword-mcp" }
innerword-agent-setup = { path = "crates/innerword-agent-setup" }
# The assistant inside the app: the engine behind one interface (Claude Code is
# its first backend; no GPUI), the shared chat components with the side chat
# panel, and the quick chat popover.
innerword-assistant = { path = "crates/innerword-assistant" }
innerword-assistant-ui = { path = "crates/innerword-assistant-ui" }
innerword-assistant-quick = { path = "crates/innerword-assistant-quick" }
innerword-keymap = { path = "crates/innerword-keymap" }
innerword-keymap-ui = { path = "crates/innerword-keymap-ui" }
# Printing: what a printed page is as data, the PDF made of it, the macOS print
# operation (no GPUI, and still built in `target/`: see its manifest).
innerword-print = { path = "crates/innerword-print" }
# Image files: bytes as they come to bytes as the library stores them (no GPUI;
# the app and the command layer for agents make the same thing of the same file).
innerword-image = { path = "crates/innerword-image" }
# Pages: an HTML page (with its CSS, scripts, fonts, pictures, sounds) made into the
# files the library keeps, every piece from the web fetched once (no GPUI, no WebKit).
innerword-page = { path = "crates/innerword-page" }
# Pages in WebKit: the view in the window, the offline check of a page, a page printed
# to a PDF (no GPUI; Objective-C through `objc`).
innerword-web = { path = "crates/innerword-web" }

# Shared third-party crates. Crate-specific dependencies are declared in the
# crate's own Cargo.toml, not here.
# runtime_shaders: the offline Metal compiler is an optional download in recent Xcode
# (xcodebuild -downloadComponent MetalToolchain); with runtime_shaders Metal.framework
# compiles the shaders when the app starts, so neither contributors nor CI need it.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
unicode-segmentation = "1"
# localtime_r (dates in the editor tools, times in the version history).
libc = "0.2"
# The NSWindow behind a GPUI window (window capture for visual QA) and
# Objective-C calls (user name, user defaults, forcing a frame).
raw-window-handle = "0.6"
objc = "0.2"
# CoreFoundation and CoreGraphics (the PDF of a print job, ImageIO for image
# files): the versions gpui locks, so nothing is compiled twice in `target/`.
core-foundation = "0.10"
core-graphics = "0.24"
# Throwaway libraries on disk in tests.
tempfile = "3"

# Keep debug info minimal, which keeps target/ small.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "debuginfo"
