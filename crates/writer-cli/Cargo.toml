[package]
name = "writer-cli"
description = "The `writer` command line tool: The Writer's library for agents and scripts, without the app."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "writer"
path = "src/main.rs"

[dependencies]
writer-mcp.workspace = true
writer-agent-setup.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
writer-store.workspace = true
# The app's end of the channel, for the thread that stands in for the app in the tests.
writer-agent.workspace = true
