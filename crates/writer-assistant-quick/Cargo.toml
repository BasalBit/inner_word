[package]
name = "writer-assistant-quick"
description = "The quick chat of The Writer's assistant: a small popover at the selection or the caret."
version.workspace = true
edition.workspace = true
publish.workspace = true
# tests/main.rs is the one test binary; the other files in tests/ are its modules.
autotests = false

[lib]
# All tests live in tests/main.rs, so the crate links one GPUI test binary.
test = false
doctest = false

[dependencies]
gpui.workspace = true
writer-core.workspace = true
writer-editor.workspace = true
# The Markdown importer: an answer is Markdown and goes into the text as
# formatted text.
writer-export.workspace = true
writer-ui.workspace = true

[dev-dependencies]
# Headless GPUI tests: #[gpui::test], TestAppContext, VisualTestContext.
gpui = { workspace = true, features = ["test-support"] }
# The Vim cases: a real VimMode attached to the editor under the popover.
writer-vim-mode.workspace = true
writer-vim.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
