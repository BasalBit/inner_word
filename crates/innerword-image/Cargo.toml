[package]
name = "innerword-image"
description = "Image files for Inner Word: bytes as they come (a file, the clipboard, a drop, an agent's path) to bytes as the library stores them."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# No GPUI: a pure crate (`CARGO_TARGET_DIR=target-pure`), used by the app and
# by the command layer for agents alike.
[dependencies]
# The format of stored bytes (`ImageFormat`), and what the library is handed.
innerword-store.workspace = true
# CFData, CFDictionary, CFString: what ImageIO takes and gives.
core-foundation.workspace = true
# CGImage, and the bitmap context the test pictures are drawn in.
core-graphics.workspace = true
