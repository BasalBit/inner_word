[package]
name = "innerword-editor"
description = "The GPUI rich text editor for Inner Word."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
serde.workspace = true
innerword-core.workspace = true
innerword-ui.workspace = true
# What a printed page is as data (no GPUI): the print pass of the layout fills
# its pages.
innerword-print.workspace = true
# Decoding the pictures of a document for the screen, and the small vector
# GPUI's image frames are held in. Both are built for gpui already.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
smallvec = "1"

[dev-dependencies]
# Headless GPUI tests: #[gpui::test], TestAppContext, VisualTestContext.
# Tests are unit tests in the lib (src/tests/), so the crate has one test binary.
gpui = { workspace = true, features = ["test-support"] }
anyhow.workspace = true
serde_json.workspace = true
# The demo example captures its own window for visual QA (same approach as
# innerword-app's screenshot module): the NSWindow number behind a GPUI window.
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc = "0.2"

[[example]]
name = "demo"
path = "examples/demo/main.rs"
