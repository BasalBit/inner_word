[package]
name = "writer-app"
description = "The Writer: a keyboard-first writing app for macOS."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "writer_app"
path = "src/lib.rs"

[[bin]]
name = "the-writer"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
anyhow.workspace = true
writer-ui.workspace = true
# Window capture for visual QA: the NSWindow number behind a GPUI window.
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
