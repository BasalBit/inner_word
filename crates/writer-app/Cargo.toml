[package]
name = "writer-app"
description = "The Writer: a keyboard-first writing app for macOS."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "writer_app"
path = "src/lib.rs"
# All tests are in tests/main.rs (one GPUI test binary, see below).
test = false
doctest = false

[[bin]]
name = "the-writer"
path = "src/main.rs"
test = false

[dependencies]
gpui.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
writer-core.workspace = true
writer-ui.workspace = true
writer-editor.workspace = true
writer-export.workspace = true
# Not in [workspace.dependencies]: only this crate uses them.
writer-library = { path = "../writer-library" }
writer-editor-tools = { path = "../writer-editor-tools" }
writer-comments = { path = "../writer-comments" }
writer-vim-mode = { path = "../writer-vim-mode" }
# Window capture for visual QA: the NSWindow number behind a GPUI window.
raw-window-handle = "0.6"
# localtime_r for the times in the version history (already in the lock tree
# through gpui).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
writer-editor.workspace = true

# One integration-test binary (tests/main.rs with submodules): each GPUI test
# binary costs about 150 MB of disk.
[[test]]
name = "main"
path = "tests/main.rs"
