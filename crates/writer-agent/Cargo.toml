[package]
name = "writer-agent"
description = "The headless command layer of The Writer: every operation an agent can perform on a library, without the app."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
writer-core.workspace = true
writer-store.workspace = true
writer-export.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The user id and whether a process exists, for the socket of the live channel.
libc.workspace = true
# Word boundaries, to change a paragraph word by word.
unicode-segmentation.workspace = true

[dev-dependencies]
tempfile.workspace = true
# To make a library as an older version of the app left it (the same build of SQLite
# the store uses).
rusqlite = { version = "0.42", features = ["bundled"] }
