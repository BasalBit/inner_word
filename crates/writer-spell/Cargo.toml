[package]
name = "writer-spell"
description = "Spell checking for The Writer: the spell service (the macOS system checker, and a fake for tests) and the checker that keeps an Editor's spelling marks current."
version.workspace = true
edition.workspace = true
publish.workspace = true
# tests/main.rs is the only test target; its modules are in tests/suite/.
autotests = false
autoexamples = false

[lib]
# Every test binary that links GPUI costs about 150 MB. All tests of this
# crate live in tests/main.rs, so the lib builds no test binary of its own.
test = false
doctest = false

[dependencies]
gpui.workspace = true
writer-core.workspace = true
writer-editor.workspace = true
writer-ui.workspace = true

# NSSpellChecker, through the same Objective-C binding the app uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc.workspace = true

[dev-dependencies]
# Headless GPUI tests: #[gpui::test], TestAppContext, VisualTestContext.
gpui = { workspace = true, features = ["test-support"] }
# The demo example captures its own window for visual QA (the NSWindow
# number behind a GPUI window), as the other demos do.
raw-window-handle.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
