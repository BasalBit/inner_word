[package]
name = "innerword-assistant-ui"
description = "The assistant inside Inner Word, as it is seen: the shared chat components (message list with streamed, formatted answers, composer, model and effort pickers, answer actions, notices) and the side chat panel."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# tests/main.rs is the only test target; its modules are in tests/suite/.
autotests = false
autoexamples = false

[lib]
# Every test binary that links GPUI costs about 150 MB. All tests of this
# crate live in tests/main.rs, so the lib builds no test binary of its own.
test = false
doctest = false

[dependencies]
gpui.workspace = true
innerword-core.workspace = true
innerword-editor.workspace = true
innerword-ui.workspace = true
# Markdown to a document: an answer is shown as formatted text.
innerword-export.workspace = true
# The engine: the backend interface, the conversation model, the fake backend.
innerword-assistant.workspace = true

[dev-dependencies]
# Headless GPUI tests: #[gpui::test], TestAppContext, VisualTestContext.
gpui = { workspace = true, features = ["test-support"] }
anyhow.workspace = true
# The example captures its own window for visual QA (the same approach as
# innerword-app's screenshot module): the NSWindow number behind a GPUI window.
raw-window-handle.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[[example]]
name = "assistant"
path = "examples/assistant/main.rs"
