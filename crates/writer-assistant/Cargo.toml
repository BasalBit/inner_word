[package]
name = "writer-assistant"
description = "The engine of the assistant inside The Writer: the interface to a terminal agent, the Claude Code backend, a fake backend for tests, the conversation model, context assembly and the system prompts. No GPUI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The read-only tools of the library come from the MCP server's own table, so the
# list the side chat allows cannot drift from what `writer mcp` offers.
writer-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# kill(2) for the group of an agent process (stop, close), setsid for a new one.
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
