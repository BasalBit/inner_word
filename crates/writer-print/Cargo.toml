[package]
name = "writer-print"
description = "Printing for The Writer: what a printed page is as data, the PDF made of it, and the macOS print operation."
version.workspace = true
edition.workspace = true
publish.workspace = true

# No GPUI in this crate, and yet it builds and tests in the default `target/`
# (not in `target-pure`): everything below is compiled there for gpui already,
# in the versions gpui locks, and the crate is only ever linked into GPUI crates.
[dependencies]
# CFData, CFString, CFDictionary: the PDF context writes into a CFData.
core-foundation.workspace = true
# The PDF context, paths, images, colours.
core-graphics.workspace = true
# CTFont, CTLine, CTRun: the glyphs of a row of text.
core-text = "21"
# The font of a family, weight and style, found the way GPUI finds it.
font-kit = { package = "zed-font-kit", version = "0.14.1-zed" }
# AppKit's print operation and PDFKit, through the Objective-C binding the app uses.
objc.workspace = true

# The print operation run as a save job. AppKit wants the main thread of the
# process for it, which a test of the default harness never has: this target is
# a program of its own (`cargo test -p writer-print` runs it with the others).
[[test]]
name = "save_job"
path = "tests/save_job.rs"
harness = false
