[package]
name = "innerword-assistant"
description = "The engine of the assistant inside Inner Word: the interface to a terminal agent, the Claude Code backend, a fake backend for tests, the conversation model, context assembly and the system prompts. No GPUI."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# tests/main.rs is the only test target; its modules are in tests/suite/.
autotests = false

# A stand-in for the `claude` program, for the process-level tests of this crate
# (tests/suite). It is not part of the app and is never bundled.
[[bin]]
name = "fake-claude"
path = "tests/fake_claude/main.rs"
test = false
doc = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
# The read-only tools of the library come from the MCP server's own table, so the
# list the side chat allows cannot drift from what `innerword mcp` offers.
innerword-mcp.workspace = true
# The folders agents are installed in: the same list the Agents panel detects them with.
innerword-agent-setup.workspace = true
# The format of an answer's drawing, read with the converter's own types (`Drawing`).
innerword-board.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# kill(2) for the group of an agent process (stop, close), setsid for a new one.
libc.workspace = true

[dev-dependencies]
# The tools test reads the server's own table.
innerword-mcp.workspace = true
tempfile.workspace = true
